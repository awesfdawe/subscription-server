[project]
name = "app"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp[speedups]>=3.14.3",
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "litestar>=2.24.0",
    "loguru>=0.7.3",
    "msgspec>=0.21.1",
    "sqlalchemy[aiosqlite]>=2.0.51",
    "uvicorn>=0.52.1",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = ["ruff>=0.16.2", "ty>=0.0.69"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",      # isort
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "E",      # pycodestyle errors
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "T20",    # flake8-print
    "RET",    # flake8-return
    "A",      # flake8-builtins
    "N",      # pep8-naming
    "ARG001", # unused arguments in functions
]
