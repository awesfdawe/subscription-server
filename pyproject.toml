[tool.uv.workspace]
members = ["backend", "proxy_schemas"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",      # isort
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "E",      # pycodestyle errors
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "T20",    # flake8-print
    "RET",    # flake8-return
    "A",      # flake8-builtins
    "N",      # pep8-naming
    "ARG001", # unused arguments in functions
]
