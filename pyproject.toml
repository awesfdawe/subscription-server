[project]
name = "subscription-server"
version = "0.1.0"
description = "Litestar + Svelte Inertia boilerplate"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=45.0.0",
    "litestar[standard]>=2.18.0",
    "litestar-vite>=0.6.1",
    "markupsafe>=3.0.0",
    "outbound-models",
]

[tool.uv.workspace]
members = [
    "outbound-models",
]

[tool.uv.sources]
outbound-models = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "ty>=0.0.40",
]

[tool.ruff]
line-length = 120
