[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "litestar>=2.24.0",
    "msgspec[yaml]>=0.21.1",
    "proxy-schemas",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[tool.uv.sources]
proxy-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
