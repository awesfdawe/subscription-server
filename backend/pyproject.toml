[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.0",
    "litestar>=2.24.0",
    "msgspec[yaml]>=0.21.1",
    "proxy-schemas",
    "sqlalchemy[aiosqlite]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
    "watchfiles>=1.2.0",
]

[tool.uv.sources]
proxy-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
